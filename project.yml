name: FlowBreak
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
packages:
  FlowBreakCore:
    path: Packages/FlowBreakCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FlowBreak:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: FlowBreakCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.flowbreak.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlowBreak
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  FlowBreak:
    build:
      targets:
        FlowBreak: all
    run:
      config: Debug

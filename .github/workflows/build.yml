name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Check and package (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Install XcodeGen 2.45.4
        run: ./scripts/install-xcodegen.sh
      - name: Check documentation, test and build
        run: make check
      - name: Package Release DMG
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            ./scripts/release.sh "$REF_NAME"
          else
            ./scripts/release.sh
          fi
      - name: Save download package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FlowBreak-macos-arm64
          path: .build/release/dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true # Explicitly scoped to generated dist files under .build/.

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
    steps:
      # No repository checkout or application code executes with the write token.
      - name: Download checked package from this run
        run: gh run download "$RUN_ID" --name FlowBreak-macos-arm64 --dir dist
      - name: Verify checksum and publish assets
        run: |
          cd dist
          sha256sum -c -- ./*.sha256
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" ./*.dmg ./*.sha256 \
            --verify-tag --title "FlowBreak $RELEASE_TAG" \
            --generate-notes --notes-file RELEASE-NOTES.md "${flags[@]}"
